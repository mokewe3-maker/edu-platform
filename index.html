<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>惠教资源平台 - 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 50%, #1565c0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-container {
    background: white;
    border-radius: 16px;
    padding: 40px;
    width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .logo-area {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 28px;
  }
  .logo-area h1 {
    font-size: 22px;
    font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 6px;
  }
  .logo-area p {
    font-size: 13px;
    color: #888;
  }
  .tab-group {
    display: flex;
    background: #f5f5f5;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 28px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    color: #666;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: white;
    color: #1a73e8;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #444;
    margin-bottom: 8px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    font-size: 14px;
    color: #333;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .form-group input:focus {
    border-color: #1a73e8;
  }
  .form-group .input-icon {
    position: relative;
  }
  .form-group .input-icon input {
    padding-left: 44px;
  }
  .form-group .input-icon .icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #999;
    font-size: 16px;
  }
  .btn-login {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: 2px;
    font-family: inherit;
    margin-top: 8px;
  }
  .btn-login:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-login:active { transform: translateY(0); }
  .error-msg {
    background: #fef0f0;
    border: 1px solid #fcc;
    color: #c62828;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .footer-tip {
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: #aaa;
  }
  .demo-info {
    background: #e8f4fd;
    border: 1px solid #bee3f8;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 12px;
    color: #1a73e8;
    line-height: 1.8;
  }
  .demo-info strong { font-weight: 600; }
</style>
</head>
<body>
<div class="login-container">
  <div class="logo-area">
    <div class="logo-icon">📚</div>
    <h1>惠教资源平台</h1>
    <p>让教育更高效，让学习更精彩</p>
  </div>

  <div class="tab-group">
    <button class="tab-btn active" onclick="switchTab('admin')">管理员登录</button>
    <button class="tab-btn" onclick="switchTab('teacher')">教师登录</button>
  </div>

  <div id="error-msg" class="error-msg">账号或密码错误，请重试</div>

  <div class="form-group">
    <label>账号</label>
    <div class="input-icon">
      <span class="icon">👤</span>
      <input type="text" id="username" placeholder="请输入账号" autocomplete="off">
    </div>
  </div>

  <div class="form-group">
    <label>密码</label>
    <div class="input-icon">
      <span class="icon">🔒</span>
      <input type="password" id="password" placeholder="请输入密码">
    </div>
  </div>

  <button class="btn-login" onclick="doLogin()">登 录</button>

  <div class="footer-tip">© 2026 惠教资源平台 · 让每一堂课都更精彩</div>
</div>

<script>
  let currentRole = 'admin';

  // 初始化默认数据
  function initData() {
    if (!localStorage.getItem('edu_admin')) {
      localStorage.setItem('edu_admin', JSON.stringify({
        username: 'admin',
        password: 'admin123',
        name: '超级管理员'
      }));
    }
    if (!localStorage.getItem('edu_teachers')) {
      localStorage.setItem('edu_teachers', JSON.stringify([
        {
          id: 't001',
          username: 'teacher1',
          password: 'teacher123',
          name: '张老师',
          subject: '数学',
          classes: ['初一(1)班', '初一(2)班'],
          avatar: '张',
          email: 'zhang@school.edu',
          phone: '138****0001',
          createdAt: '2026-01-01'
        }
      ]));
    }
    if (!localStorage.getItem('edu_lessons')) {
      localStorage.setItem('edu_lessons', JSON.stringify([]));
    }
    if (!localStorage.getItem('edu_students')) {
      localStorage.setItem('edu_students', JSON.stringify([]));
    }
    if (!localStorage.getItem('edu_homework')) {
      localStorage.setItem('edu_homework', JSON.stringify([]));
    }
    if (!localStorage.getItem('edu_resources')) {
      localStorage.setItem('edu_resources', JSON.stringify([]));
    }
    if (!localStorage.getItem('edu_announcements')) {
      localStorage.setItem('edu_announcements', JSON.stringify([]));
    }
  }

  function switchTab(role) {
    currentRole = role;
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
      btn.classList.toggle('active', (i === 0 && role === 'admin') || (i === 1 && role === 'teacher'));
    });
    document.getElementById('error-msg').style.display = 'none';
    // 自动填充已保存的教师账号
    tryAutoFill(role);
  }

  function tryAutoFill(role) {
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    if (role === 'teacher') {
      // 查找所有已保存的教师账号
      const teachers = JSON.parse(localStorage.getItem('edu_teachers') || '[]');
      for (const t of teachers) {
        const saved = localStorage.getItem('edu_saved_' + t.username);
        if (saved) {
          const info = JSON.parse(saved);
          document.getElementById('username').value = info.username;
          document.getElementById('password').value = info.password;
          break;
        }
      }
    }
  }

  function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error-msg');

    if (!username || !password) {
      errorEl.textContent = '请填写账号和密码';
      errorEl.style.display = 'block';
      return;
    }

    if (currentRole === 'admin') {
      const admin = JSON.parse(localStorage.getItem('edu_admin') || '{}');
      if (admin.username === username && admin.password === password) {
        sessionStorage.setItem('edu_current_user', JSON.stringify({ role: 'admin', ...admin }));
        // 设置登录标记，用于多开检测
        localStorage.setItem('edu_login_' + username, Date.now().toString());
        localStorage.setItem('edu_login_info', JSON.stringify({ role: 'admin', username: username }));
        window.location.href = 'admin.html';
      } else {
        errorEl.textContent = '管理员账号或密码错误';
        errorEl.style.display = 'block';
      }
    } else {
      const teachers = JSON.parse(localStorage.getItem('edu_teachers') || '[]');
      const teacher = teachers.find(t => t.username === username && t.password === password);
      if (teacher) {
        sessionStorage.setItem('edu_current_user', JSON.stringify({ role: 'teacher', ...teacher }));
        // 设置登录标记，用于多开检测
        localStorage.setItem('edu_login_' + username, Date.now().toString());
        localStorage.setItem('edu_login_info', JSON.stringify({ role: 'teacher', username: username }));
        window.location.href = 'teacher.html';
      } else {
        errorEl.textContent = '教师账号或密码错误';
        errorEl.style.display = 'block';
      }
    }
  }

  // 检测是否在其他地方已登录（多开检测）
  function checkMultiLogin() {
    const loginInfo = localStorage.getItem('edu_login_info');
    if (loginInfo) {
      const info = JSON.parse(loginInfo);
      const loginTime = localStorage.getItem('edu_login_' + info.username);
      // 如果登录时间超过24小时，清除标记
      if (loginTime && Date.now() - parseInt(loginTime) > 24 * 60 * 60 * 1000) {
        localStorage.removeItem('edu_login_info');
        localStorage.removeItem('edu_login_' + info.username);
        return;
      }
    }
  }
  checkMultiLogin();

  // 监听其他标签页的登录状态变化
  window.addEventListener('storage', function(e) {
    if (e.key === 'edu_login_info' && e.newValue) {
      const newInfo = JSON.parse(e.newValue);
      // 如果检测到其他标签页登录了不同账号，提示并跳转
      const username = document.getElementById('username').value.trim();
      if (username && newInfo.username !== username) {
        alert('您的账号 ' + username + ' 已在其他浏览器标签页登录。同一账号不能同时在多个标签页登录。');
        window.location.href = 'index.html';
      }
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  initData();
  // 页面加载时如果是教师tab，检测是否有保存的账号
  tryAutoFill('admin');
</script>
</body>
</html>
